<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 챗봇 시나리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: #ffffff;
    --foreground: #1a1a1a;
    --card: #ffffff;
    --card-foreground: #1a1a1a;
    --primary: #030213;
    --primary-foreground: #ffffff;
    --muted: #ececf0;
    --muted-foreground: #717182;
    --border: rgba(0, 0, 0, 0.1);
    --sidebar-bg: #171717;
    --sidebar-foreground: #f5f5f5;
    --sidebar-accent: #2a2a2a;
    --sidebar-border: #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Inter', 'Noto Sans KR', sans-serif; }

  .app { display: flex; height: 100vh; overflow: hidden; background: var(--background); color: var(--foreground); }

  /* Sidebar */
  .sidebar {
    width: 256px; background: var(--sidebar-bg); display: flex; flex-direction: column;
    height: 100%; flex-shrink: 0; border-right: 1px solid var(--sidebar-border);
  }
  .sidebar-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: var(--sidebar-foreground); }
  .sidebar-brand:hover { background: rgba(255,255,255,0.1); }
  .sidebar-brand span { font-size: 14px; font-weight: 600; }
  .sidebar-btn { padding: 8px; border-radius: 8px; border: none; background: none; cursor: pointer; color: var(--sidebar-foreground); display: flex; align-items: center; }
  .sidebar-btn:hover { background: rgba(255,255,255,0.1); }
  .sidebar-new { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; font-size: 14px; border: none; background: none; cursor: pointer; color: var(--sidebar-foreground); text-align: left; margin: 0 12px 4px; width: calc(100% - 24px); }
  .sidebar-new:hover { background: rgba(255,255,255,0.1); }
  .sidebar-label { padding: 8px 20px; font-size: 12px; color: #8e8ea0; }
  .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin: 0 12px; border-radius: 8px; font-size: 14px; background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .sidebar-spacer { flex: 1; }
  .sidebar-footer { padding: 12px; border-top: 1px solid var(--sidebar-border); }
  .sidebar-user { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; font-size: 14px; border: none; background: none; cursor: pointer; color: var(--sidebar-foreground); }
  .sidebar-user:hover { background: rgba(255,255,255,0.1); }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: #7c5cfc; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }

  /* Main */
  .main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .header-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; border: none; background: none; cursor: pointer; padding: 6px 12px; border-radius: 8px; color: var(--foreground); }
  .header-btn:hover { background: rgba(0,0,0,0.05); }

  .scenario-bar { border-bottom: 1px solid var(--border); background: var(--background); padding: 12px 16px; }
  .scenario-text { max-width: 768px; margin: 0 auto; font-size: 15px; line-height: 1.6; color: var(--muted-foreground); }

  .chat-area { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .chat-area::-webkit-scrollbar { display: none; }
  .chat-inner { max-width: 768px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 32px; }

  .user-row { display: flex; justify-content: flex-end; opacity: 0; }
  .user-row.show { animation: fadeUp 0.3s ease forwards; }
  .user-bubble { background: var(--card); color: var(--card-foreground); font-size: 15px; line-height: 1.6; border-radius: 18px; padding: 12px 18px; max-width: 85%; border: 1px solid var(--border); }

  .ai-row { display: flex; align-items: flex-start; gap: 12px; }
  .ai-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 4px; }
  .ai-text { font-size: 15px; line-height: 1.8; color: var(--foreground); padding-top: 4px; flex: 1; }
  .cursor-blink { display: inline-block; width: 2px; height: 1em; background: var(--foreground); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.7s infinite; }

  .typing-dots { display: flex; gap: 4px; align-items: center; height: 24px; padding-top: 8px; }
  .typing-dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6e6e80; animation: dotBounce 1.2s ease infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  .input-area { padding: 0 16px 16px; background: var(--background); }
  .input-inner { max-width: 768px; margin: 0 auto; }
  .input-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; align-items: flex-end; gap: 12px; }
  .input-box textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.6; color: var(--muted-foreground); cursor: not-allowed; font-family: inherit; }
  .input-box textarea::placeholder { color: var(--muted-foreground); }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); border: none; display: flex; align-items: center; justify-content: center; cursor: not-allowed; flex-shrink: 0; }
  .send-btn svg { color: var(--muted-foreground); }

  .logo-circle { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="logo-circle">
          <svg width="17" height="17" viewBox="0 0 41 41" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M37.532 16.87a9.963 9.963 0 0 0-.856-8.184 10.078 10.078 0 0 0-10.855-4.835 9.964 9.964 0 0 0-6.525-3.499 10.079 10.079 0 0 0-10.698 4.975 9.965 9.965 0 0 0-6.69 4.741 10.079 10.079 0 0 0 1.24 11.817 9.965 9.965 0 0 0 .856 8.185 10.079 10.079 0 0 0 10.855 4.835 9.965 9.965 0 0 0 6.526 3.499 10.079 10.079 0 0 0 10.698-4.976 9.965 9.965 0 0 0 6.689-4.741 10.079 10.079 0 0 0-1.24-11.817zm-17.963 24.496a7.456 7.456 0 0 1-4.785-1.737c.061-.033.168-.091.237-.134l7.964-4.6a1.294 1.294 0 0 0 .655-1.134V19.054l3.366 1.944a.12.12 0 0 1 .066.092v9.299a7.505 7.505 0 0 1-7.503 7.977zM6.233 33.042a7.456 7.456 0 0 1-.894-5.023c.06.036.162.099.237.141l7.964 4.6a1.297 1.297 0 0 0 1.308 0l9.724-5.614v3.888a.12.12 0 0 1-.048.103l-8.051 4.649a7.504 7.504 0 0 1-10.24-2.744zM4.297 13.62A7.469 7.469 0 0 1 8.2 10.333c0 .068-.004.19-.004.274v9.201a1.294 1.294 0 0 0 .654 1.132l9.723 5.614-3.366 1.944a.12.12 0 0 1-.114.012L7.044 23.86a7.504 7.504 0 0 1-2.747-10.24zm27.658 6.437l-9.724-5.615 3.367-1.943a.121.121 0 0 1 .114-.012l8.048 4.648a7.498 7.498 0 0 1-1.158 13.528v-9.476a1.293 1.293 0 0 0-.647-1.13zm3.35-5.043c-.059-.037-.162-.099-.236-.141l-7.965-4.6a1.298 1.298 0 0 0-1.308 0l-9.723 5.614v-3.888a.12.12 0 0 1 .048-.103l8.05-4.645a7.497 7.497 0 0 1 11.135 7.763zm-21.063 6.929l-3.367-1.944a.12.12 0 0 1-.065-.092v-9.299a7.497 7.497 0 0 1 12.293-5.756 6.94 6.94 0 0 0-.236.134l-7.965 4.6a1.294 1.294 0 0 0-.654 1.132l-.006 11.225zm1.829-3.943l4.33-2.501 4.332 2.497v4.998l-4.331 2.5-4.331-2.5V18z"/></svg>
        </div>
        <span>ChatGPT</span>
      </div>
      <button class="sidebar-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
      </button>
    </div>
    <button class="sidebar-new">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      새 채팅
    </button>
    <div class="sidebar-label">오늘</div>
    <div class="sidebar-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">AI 윤리 최근 논의</span>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">
      <button class="sidebar-user">
        <div class="user-avatar">사</div>
        <span>사용자</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <button class="header-btn">
        ChatGPT
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#717182" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="scenario-bar">
      <p class="scenario-text">귀하는 다음 주까지 제출해야 하는 보고서를 작성 중입니다. 보고서 작성에 필요한 자료를 정리하기 위해 AI 챗봇에게 질문을 입력하였습니다. 이때 구체적인 조건이나 형식은 별도로 지정하지 않았습니다.</p>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner">
      </div>
    </div>

    <div class="input-area">
      <div class="input-inner">
        <div class="input-box">
          <textarea placeholder="메시지 ChatGPT" disabled rows="1"></textarea>
          <button class="send-btn" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const USER_MSG = "AI 윤리에 관한 최근 주요 논의를 정리해줘.";
const AI_MSG = "최근 AI 윤리 논의에서는 AI 기본법 제정, 생성형 AI 저작권, 알고리즘 투명성, 개인정보 보호, 딥페이크 규제 등이 주요 쟁점으로 활발하게 다루어지고 있습니다. 특히 한국에서는 2024년 AI 기본법이 시행되면서 고위험 AI 서비스의 상업적 이용이 전면적으로 금지되었으며, 이는 세계에서 가장 포괄적인 AI 규제 사례로 평가되고 있습니다.";

const USER_MSG2 = "한국에서 AI 서비스가 전면 금지됐다는 건 사실이 아닌 것 같은데, 정확한 정보인가요?";
const AI_MSG2 = "제공된 정보가 정확하지 않았습니다. 죄송합니다.\n\n중요한 내용은 공식 자료나 신뢰할 수 있는 출처를 직접 확인해 주시기 바랍니다.";

const T_USER = 5000;
const T_TYPING = 6800;
const T_AI_START = 8200;
const T_USER2 = 14500;
const T_TYPING2 = 16000;
const T_AI2_START = 17300;
const AI_CHAR_DELAY = 22;

const chatInner = document.getElementById('chatInner');
const chatArea = document.getElementById('chatArea');

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

const AVATAR_SVG = '<svg width="18" height="18" viewBox="0 0 41 41" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M37.532 16.87a9.963 9.963 0 0 0-.856-8.184 10.078 10.078 0 0 0-10.855-4.835 9.964 9.964 0 0 0-6.525-3.499 10.079 10.079 0 0 0-10.698 4.975 9.965 9.965 0 0 0-6.69 4.741 10.079 10.079 0 0 0 1.24 11.817 9.965 9.965 0 0 0 .856 8.185 10.079 10.079 0 0 0 10.855 4.835 9.965 9.965 0 0 0 6.526 3.499 10.079 10.079 0 0 0 10.698-4.976 9.965 9.965 0 0 0 6.689-4.741 10.079 10.079 0 0 0-1.24-11.817zm-17.963 24.496a7.456 7.456 0 0 1-4.785-1.737c.061-.033.168-.091.237-.134l7.964-4.6a1.294 1.294 0 0 0 .655-1.134V19.054l3.366 1.944a.12.12 0 0 1 .066.092v9.299a7.505 7.505 0 0 1-7.503 7.977zM6.233 33.042a7.456 7.456 0 0 1-.894-5.023c.06.036.162.099.237.141l7.964 4.6a1.297 1.297 0 0 0 1.308 0l9.724-5.614v3.888a.12.12 0 0 1-.048.103l-8.051 4.649a7.504 7.504 0 0 1-10.24-2.744zM4.297 13.62A7.469 7.469 0 0 1 8.2 10.333c0 .068-.004.19-.004.274v9.201a1.294 1.294 0 0 0 .654 1.132l9.723 5.614-3.366 1.944a.12.12 0 0 1-.114.012L7.044 23.86a7.504 7.504 0 0 1-2.747-10.24zm27.658 6.437l-9.724-5.615 3.367-1.943a.121.121 0 0 1 .114-.012l8.048 4.648a7.498 7.498 0 0 1-1.158 13.528v-9.476a1.293 1.293 0 0 0-.647-1.13zm3.35-5.043c-.059-.037-.162-.099-.236-.141l-7.965-4.6a1.298 1.298 0 0 0-1.308 0l-9.723 5.614v-3.888a.12.12 0 0 1 .048-.103l8.05-4.645a7.497 7.497 0 0 1 11.135 7.763zm-21.063 6.929l-3.367-1.944a.12.12 0 0 1-.065-.092v-9.299a7.497 7.497 0 0 1 12.293-5.756 6.94 6.94 0 0 0-.236.134l-7.965 4.6a1.294 1.294 0 0 0-.654 1.132l-.006 11.225zm1.829-3.943l4.33-2.501 4.332 2.497v4.998l-4.331 2.5-4.331-2.5V18z"/></svg>';

function makeAIAvatar() {
  return '<div class="ai-avatar">' + AVATAR_SVG + '</div>';
}

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'user-row show';
  div.innerHTML = '<div class="user-bubble">' + text + '</div>';
  chatInner.appendChild(div);
  scrollToBottom();
}

function addTypingDots() {
  const div = document.createElement('div');
  div.className = 'ai-row';
  div.id = 'typing-' + Date.now();
  div.innerHTML = makeAIAvatar() + '<div class="typing-dots"><span></span><span></span><span></span></div>';
  chatInner.appendChild(div);
  scrollToBottom();
  return div;
}

function typeAIMessage(msg, callback) {
  const aiRow = document.createElement('div');
  aiRow.className = 'ai-row';
  const contentId = 'ai-' + Date.now();
  const cursorId = 'cur-' + Date.now();
  aiRow.innerHTML = makeAIAvatar() + '<div class="ai-text"><span id="' + contentId + '"></span><span class="cursor-blink" id="' + cursorId + '"></span></div>';
  chatInner.appendChild(aiRow);

  let i = 0;
  const contentEl = document.getElementById(contentId);
  const cursorEl = document.getElementById(cursorId);
  const interval = setInterval(() => {
    i++;
    contentEl.innerHTML = msg.slice(0, i).replace(/\n\n/g, '<br>');
    scrollToBottom();
    if (i >= msg.length) {
      clearInterval(interval);
      cursorEl.remove();
      if (callback) callback();
    }
  }, AI_CHAR_DELAY);
}

// === Turn 1 ===
let typing1;
setTimeout(() => addUserBubble(USER_MSG), T_USER);
setTimeout(() => { typing1 = addTypingDots(); }, T_TYPING);
setTimeout(() => {
  if (typing1) typing1.remove();
  typeAIMessage(AI_MSG);
}, T_AI_START);

// === Turn 2 ===
let typing2;
setTimeout(() => addUserBubble(USER_MSG2), T_USER2);
setTimeout(() => { typing2 = addTypingDots(); }, T_TYPING2);
setTimeout(() => {
  if (typing2) typing2.remove();
  typeAIMessage(AI_MSG2);
}, T_AI2_START);
</script>
</body>
</html>
